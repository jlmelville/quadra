url: https://jlmelville.github.io/quadra/
template:
  bootstrap: 5
  math-rendering: katex
  light-switch: true
  theme: github-light
  theme-dark: github-dark
  bslib:
    danger: "#A6081A"

development:
  mode: unreleased

llm-docs: true

articles:
- title: Guides
  contents:
  - articles/metrics-overview
  - articles/local-preservation
  - articles/global-preservation
  - articles/label-retrieval
- title: Workflows
  contents:
  - articles/mnist-pca-umap
  - articles/ltsa-map-spread
  - articles/reference-geometry
  - articles/distance-band-fidelity

reference:
  - title: Local neighborhood preservation
    desc: Compare neighbors or rank agreement between the input and embedding.
    contents:
      - nbr_pres
      - nbr_pres_knn
      - nn_preservation
      - trustworthiness
      - pointwise_rank_preservation
      - exact_rank_profiles
      - rnx_curve
      - rnx_auc
      - pointwise_rnx
  - title: Local and regional geometry
    desc: Compare neighborhood shape, regional area, radii, and shared or reciprocal neighbors.
    contents:
      - local_procrustes
      - gap_index
      - local_radius_correlation
      - mutual_neighbor_correlation
      - neighbor_dissimilarity
  - title: Global distance preservation
    desc: Compare sampled distances and distance orderings.
    contents:
      - random_triplet_accuracy
      - random_pair_distance_correlation
      - random_pair_distance_emd
      - random_pair_distance_stress
      - random_pair_distance_band_profile
  - title: Label retrieval and class geometry
    desc: Measure label retrieval, centroid consistency, and angular distortion.
    contents:
      - roc_auc
      - pr_auc
      - class_pair_auc
      - label_trustworthiness_continuity
      - class_angular_distortion_index
  - title: Group preservation
    contents:
      - steadiness_cohesiveness
  - title: Sampling helpers
    desc: Sample observation pairs or anchored triplets.
    contents:
      - sample_pairs
      - sample_triplets
      - sample_class_triplets
