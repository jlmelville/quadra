on:
  push:
    branches: [main, master]
    paths:
      - .clang-format
      - .github/workflows/native-quality.yaml
      - DESCRIPTION
      - src/**
      - tools/native-quality.sh
      - tools/requirements-clang-format.txt
  pull_request:
    branches: [main, master]
    paths:
      - .clang-format
      - .github/workflows/native-quality.yaml
      - DESCRIPTION
      - src/**
      - tools/native-quality.sh
      - tools/requirements-clang-format.txt
  workflow_dispatch:

name: Native quality

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-quality:
    name: Native quality
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          use-public-rspm: true

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          packages: deps::.
          dependencies: '"hard"'

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang python3-venv shellcheck

      - name: Install clang-format 21.1.8
        run: |
          formatter_venv="$RUNNER_TEMP/clang-format-venv"
          python3 -m venv "$formatter_venv"
          "$formatter_venv/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --requirement tools/requirements-clang-format.txt
          printf '%s\n' "$formatter_venv/bin" >> "$GITHUB_PATH"

      - name: Check native quality script
        run: |
          bash -n tools/native-quality.sh
          shellcheck tools/native-quality.sh

      - name: Run native quality checks
        run: tools/native-quality.sh
