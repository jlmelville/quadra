on:
  push:
    branches: [main, master]
    paths:
      - .clang-format
      - .github/workflows/native-quality.yaml
      - DESCRIPTION
      - src/**
      - tools/native-quality.sh
      - tools/requirements-clang-format.txt
      - tools/tsan-neighbor-overlap.cpp
      - tools/tsan-neighbor-overlap.sh
  pull_request:
    branches: [main, master]
    paths:
      - .clang-format
      - .github/workflows/native-quality.yaml
      - DESCRIPTION
      - src/**
      - tools/native-quality.sh
      - tools/requirements-clang-format.txt
      - tools/tsan-neighbor-overlap.cpp
      - tools/tsan-neighbor-overlap.sh
  workflow_dispatch:

name: Native quality

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-quality:
    name: Native quality
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          packages: deps::.
          dependencies: '"hard"'

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy python3-venv shellcheck

      - name: Install clang-format 21.1.8
        run: |
          formatter_venv="$RUNNER_TEMP/clang-format-venv"
          python3 -m venv "$formatter_venv"
          "$formatter_venv/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --no-deps \
            --requirement tools/requirements-clang-format.txt
          printf '%s\n' "$formatter_venv/bin" >> "$GITHUB_PATH"

      - name: Check native scripts
        run: |
          bash -n tools/native-quality.sh tools/tsan-neighbor-overlap.sh
          shellcheck tools/native-quality.sh tools/tsan-neighbor-overlap.sh

      - name: Run native quality checks and clang-tidy
        id: native
        shell: bash
        run: tools/native-quality.sh --tidy 2>&1 | tee "$RUNNER_TEMP/native-quality.log"

      - name: Report clang-tidy findings
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          echo '### clang-tidy' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$NATIVE_OUTCOME" != success ]]; then
            echo 'Native checks failed. See the check log for the error.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -v root="$GITHUB_WORKSPACE/" '
            /:[0-9]+:[0-9]+: warning: / && !seen[$0]++ {
              if (++n == 1) print "\n```text"
              print index($0, root) == 1 ? substr($0, length(root) + 1) : $0
            }
            END {
              if (n) print "```"
              printf "\n%d distinct warning(s). Repeated header diagnostics are counted once.\n", n
            }
          ' "$RUNNER_TEMP/native-quality.log" >> "$GITHUB_STEP_SUMMARY"

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full-length commit SHA for immutability; Dependabot updates this reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Exercise production parallel overlap counts
        run: tools/tsan-neighbor-overlap.sh
