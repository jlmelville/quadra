# R-hub's generic GitHub Actions workflow file. Its canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# Treat generated output as scaffolding and reapply repository hardening.

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'clang-asan,clang-ubsan,valgrind,gcc15'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.id || github.run_id }}

jobs:
  setup:
    name: Resolve R-hub platforms
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
      # r-hub/actions v1.7.5.
      - uses: r-hub/actions/setup@31960d331f579d85cb0c868fce1dce2aaf132935
        with:
          config: ${{ github.event.inputs.config }}
        id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    environment: rhub
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/checkout@cf6c8eff3145ef225104294e6b0c023de4bba9c6
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/platform-info@cf6c8eff3145ef225104294e6b0c023de4bba9c6
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/setup-deps@cf6c8eff3145ef225104294e6b0c023de4bba9c6
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/run-check@cf6c8eff3145ef225104294e6b0c023de4bba9c6
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    environment: rhub
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/checkout@cf6c8eff3145ef225104294e6b0c023de4bba9c6
      # r-hub/actions v1.7.5.
      - uses: r-hub/actions/setup-r@cf6c8eff3145ef225104294e6b0c023de4bba9c6
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/platform-info@cf6c8eff3145ef225104294e6b0c023de4bba9c6
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/setup-deps@cf6c8eff3145ef225104294e6b0c023de4bba9c6
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      # r-hub/actions v1.7.7.
      - uses: r-hub/actions/run-check@cf6c8eff3145ef225104294e6b0c023de4bba9c6
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
